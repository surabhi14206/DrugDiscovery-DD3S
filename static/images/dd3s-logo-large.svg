<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a58ca;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Clean background -->
  <rect width="512" height="512" fill="#ffffff"/>
  
  <!-- Center the molecular structure -->
  <g transform="translate(256, 200)">
    <!-- Molecular bonds (clean lines) -->
    <line x1="0" y1="-80" x2="0" y2="-20" stroke="#0d6efd" stroke-width="4"/>
    <line x1="0" y1="-80" x2="69.3" y2="-40" stroke="#0d6efd" stroke-width="4"/>
    <line x1="0" y1="-80" x2="-69.3" y2="-40" stroke="#0d6efd" stroke-width="4"/>
    <line x1="69.3" y1="-40" x2="69.3" y2="40" stroke="#0d6efd" stroke-width="4"/>
    <line x1="-69.3" y1="-40" x2="-69.3" y2="40" stroke="#0d6efd" stroke-width="4"/>
    <line x1="69.3" y1="40" x2="0" y2="80" stroke="#0d6efd" stroke-width="4"/>
    <line x1="-69.3" y1="40" x2="0" y2="80" stroke="#0d6efd" stroke-width="4"/>
    
    <!-- Molecular atoms (simple circles) -->
    <circle cx="0" cy="-20" r="18" fill="#0d6efd"/>
    <circle cx="0" cy="-20" r="12" fill="#ffffff"/>
    
    <circle cx="0" cy="-80" r="14" fill="#0d6efd"/>
    <circle cx="0" cy="-80" r="9" fill="#4da3ff"/>
    
    <circle cx="69.3" cy="-40" r="14" fill="#0d6efd"/>
    <circle cx="69.3" cy="-40" r="9" fill="#4da3ff"/>
    
    <circle cx="69.3" cy="40" r="14" fill="#0d6efd"/>
    <circle cx="69.3" cy="40" r="9" fill="#4da3ff"/>
    
    <circle cx="0" cy="80" r="14" fill="#0d6efd"/>
    <circle cx="0" cy="80" r="9" fill="#4da3ff"/>
    
    <circle cx="-69.3" cy="40" r="14" fill="#0d6efd"/>
    <circle cx="-69.3" cy="40" r="9" fill="#4da3ff"/>
    
    <circle cx="-69.3" cy="-40" r="14" fill="#0d6efd"/>
    <circle cx="-69.3" cy="-40" r="9" fill="#4da3ff"/>
  </g>
  
  <!-- Text section -->
  <text x="256" y="360" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" 
        fill="#0d6efd" text-anchor="middle" letter-spacing="5">DD3S</text>
  <text x="256" y="395" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600"
        fill="#6c757d" text-anchor="middle" letter-spacing="10">DRUG DISCOVERY</text>
  <text x="256" y="420" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400"
        fill="#adb5bd" text-anchor="middle" letter-spacing="3">DATABASE SYSTEM</text>
</svg>
