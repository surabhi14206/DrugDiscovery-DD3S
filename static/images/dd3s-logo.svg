<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0a0a0a" stroke="#0d6efd" stroke-width="3"/>
  
  <!-- Outer hexagon structure -->
  <path d="M 100 35 L 143.3 60 L 143.3 110 L 100 135 L 56.7 110 L 56.7 60 Z" 
        fill="none" stroke="#0d6efd" stroke-width="2" opacity="0.6"/>
  
  <!-- Inner molecular bonds -->
  <line x1="100" y1="35" x2="100" y2="85" stroke="#0d6efd" stroke-width="2"/>
  <line x1="100" y1="35" x2="143.3" y2="60" stroke="#0d6efd" stroke-width="2"/>
  <line x1="100" y1="35" x2="56.7" y2="60" stroke="#0d6efd" stroke-width="2"/>
  <line x1="143.3" y1="60" x2="143.3" y2="110" stroke="#0d6efd" stroke-width="2"/>
  <line x1="56.7" y1="60" x2="56.7" y2="110" stroke="#0d6efd" stroke-width="2"/>
  <line x1="143.3" y1="110" x2="100" y2="135" stroke="#0d6efd" stroke-width="2"/>
  <line x1="56.7" y1="110" x2="100" y2="135" stroke="#0d6efd" stroke-width="2"/>
  <line x1="56.7" y1="110" x2="143.3" y2="110" stroke="#0d6efd" stroke-width="2" opacity="0.4"/>
  <line x1="56.7" y1="60" x2="143.3" y2="60" stroke="#0d6efd" stroke-width="2" opacity="0.4"/>
  
  <!-- Central atom (larger) -->
  <circle cx="100" cy="85" r="12" fill="#0d6efd">
    <animate attributeName="r" values="12;14;12" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="85" r="8" fill="#1a73e8"/>
  
  <!-- Outer atoms -->
  <circle cx="100" cy="35" r="8" fill="#0d6efd"/>
  <circle cx="100" cy="35" r="5" fill="#4da3ff"/>
  
  <circle cx="143.3" cy="60" r="8" fill="#0d6efd"/>
  <circle cx="143.3" cy="60" r="5" fill="#4da3ff"/>
  
  <circle cx="143.3" cy="110" r="8" fill="#0d6efd"/>
  <circle cx="143.3" cy="110" r="5" fill="#4da3ff"/>
  
  <circle cx="100" cy="135" r="8" fill="#0d6efd"/>
  <circle cx="100" cy="135" r="5" fill="#4da3ff"/>
  
  <circle cx="56.7" cy="110" r="8" fill="#0d6efd"/>
  <circle cx="56.7" cy="110" r="5" fill="#4da3ff"/>
  
  <circle cx="56.7" cy="60" r="8" fill="#0d6efd"/>
  <circle cx="56.7" cy="60" r="5" fill="#4da3ff"/>
  
  <!-- Text -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        fill="#0d6efd" text-anchor="middle">DD3S</text>
  <text x="100" y="178" font-family="Arial, sans-serif" font-size="9" 
        fill="#4da3ff" text-anchor="middle">DRUG DISCOVERY</text>
</svg>
