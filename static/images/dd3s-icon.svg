<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d6efd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>
  
  <!-- Molecular structure -->
  <g transform="translate(32, 32)">
    <!-- Bonds -->
    <line x1="0" y1="-18" x2="0" y2="-6" stroke="url(#iconGrad)" stroke-width="2"/>
    <line x1="0" y1="-18" x2="15.6" y2="-9" stroke="url(#iconGrad)" stroke-width="2"/>
    <line x1="0" y1="-18" x2="-15.6" y2="-9" stroke="url(#iconGrad)" stroke-width="2"/>
    <line x1="15.6" y1="-9" x2="15.6" y2="9" stroke="url(#iconGrad)" stroke-width="2"/>
    <line x1="-15.6" y1="-9" x2="-15.6" y2="9" stroke="url(#iconGrad)" stroke-width="2"/>
    <line x1="15.6" y1="9" x2="0" y2="18" stroke="url(#iconGrad)" stroke-width="2"/>
    <line x1="-15.6" y1="9" x2="0" y2="18" stroke="url(#iconGrad)" stroke-width="2"/>
    
    <!-- Atoms -->
    <circle cx="0" cy="-6" r="5" fill="url(#iconGrad)"/>
    <circle cx="0" cy="-6" r="3" fill="#4da3ff"/>
    
    <circle cx="0" cy="-18" r="4" fill="url(#iconGrad)"/>
    <circle cx="15.6" cy="-9" r="4" fill="url(#iconGrad)"/>
    <circle cx="15.6" cy="9" r="4" fill="url(#iconGrad)"/>
    <circle cx="0" cy="18" r="4" fill="url(#iconGrad)"/>
    <circle cx="-15.6" cy="9" r="4" fill="url(#iconGrad)"/>
    <circle cx="-15.6" cy="-9" r="4" fill="url(#iconGrad)"/>
  </g>
</svg>
